name: Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  picture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install the project's environment
        run: uv sync --project MOIDAV-main
      - name: Install Atlas
        run: |
          curl -fsSL https://raw.githubusercontent.com/raoulg/atlas/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Draw the page
        run: atlas-code view --no-open --out site/index.html
      - name: Take its picture
        run: uv run --script MOIDAV-main/tools/atlas_picture.py site/index.html site/atlas.png
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
