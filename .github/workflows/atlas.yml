name: Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  picture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 2.3.4
      - name: Install the project's environment
        run: |
          python -m venv "$GITHUB_WORKSPACE/.venv"
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          poetry --directory MOIDAV-main install --no-root
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          POETRY_VIRTUALENVS_CREATE: false
      - name: Install Atlas
        run: |
          curl -fsSL https://raw.githubusercontent.com/raoulg/atlas/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Draw the page
        run: atlas-code view --no-open --out site/index.html
      - name: Take its picture
        run: poetry --directory MOIDAV-main run python tools/atlas_picture.py "$GITHUB_WORKSPACE/site/index.html" "$GITHUB_WORKSPACE/site/atlas.png"
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          POETRY_VIRTUALENVS_CREATE: false
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
